<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>黑水溝</title>
    <link rel="stylesheet" href="./CSS/p6.css" />
  </head>
  <body>
    <div class="rule">
      <div class="texttop">
        <img src="./IMG/p6_texttop.png" />
      </div>
      <div class="textmidd">
        <img src="./IMG/p6_textmidd.png" />
      </div>
      <div class="nextbtn">
        <img src="./IMG/p6_nextbtn_boat.png" class="nextboat" />
        <img src="./IMG/p6_nextbtn.png" />
      </div>
    </div>
    <div class="btn">
      <img src="./IMG/p6_btn.png" class="btnimg" />
    </div>
    <div class="ocean-container" id="scene">
      <div class="wave4 parallax-layer" data-speed="90">
        <img src="./IMG/index_wave8.png" class="waveimg" />
      </div>
      <div class="swim parallax-layer" data-speed="85">
        <div class="swim">
          <img src="./IMG/p6_swim1.png" class="swimimg1" />
          <img src="./IMG/p6_swim2.png" class="swimimg2" />
        </div>
      </div>
      <div class="wave3 parallax-layer" data-speed="80">
        <img src="./IMG/index_wave7.png" class="waveimg" />
      </div>
      <div class="wave2 parallax-layer" data-speed="60">
        <img src="./IMG/index_wave6.png" class="waveimg" />
      </div>
      <div class="wave1 parallax-layer" data-speed="50">
        <img src="./IMG/index_wave4.png" class="waveimg" />
      </div>
      <div class="hor3 parallax-layer" data-speed="40">
        <img src="./IMG/index_horizon3.png" class="waveimg" />
      </div>
      <div class="isl2 parallax-layer" data-speed="30">
        <img src="./IMG/index_island2.png" />
      </div>
    </div>

    <div class="click-count" aria-live="polite">點擊次數：0下</div>
    <div class="countdown" aria-live="polite">剩餘時間：15秒</div>

    <script src="./JS/p6.js"></script>
  </body>
</html>
