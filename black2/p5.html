<!doctype html>
<html lang="zh-Hant-TWn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>中途換船</title>
    <link rel="stylesheet" href="./CSS/p5.css" />
  </head>
  <body>
    <div class="text">
      <img src="./IMG/p5_text.png" />
    </div>
    <div class="ocean-container" id="scene">
      <div class="wave4 parallax-layer" data-speed="90">
        <img src="./IMG/index_wave8.png" class="waveimg" />
      </div>
      <div class="wave3 parallax-layer" data-speed="80">
        <img src="./IMG/index_wave7.png" class="waveimg" />
      </div>
      <div class="boat parallax-layer" data-speed="70">
        <img src="./IMG/p5_paddle.png" class="boatimg" />
      </div>
      <div class="wave2 parallax-layer" data-speed="60">
        <img src="./IMG/index_wave6.png" class="waveimg" />
      </div>
      <div class="wave1 parallax-layer" data-speed="50">
        <img src="./IMG/index_wave4.png" class="waveimg" />
      </div>
    </div>
    <div class="opt">
      <div class="opta">
        <input type="radio" name="p2" id="opta" value="a" />
        <label for="opta">
          <img src="./IMG/p5_opta.gif" class="gifa" />
          <img src="./IMG/p5_texta.png" class="texta" />
          <div class="wave">
            <div class="wave-inner">
              <img src="./IMG/p2.wave.png" />
              <img src="./IMG/p2.wave.png" />
              <img src="./IMG/p2.wave.png" />
              <img src="./IMG/p2.wave.png" />
            </div>
          </div>
        </label>
      </div>
      <div class="optb">
        <input type="radio" name="p2" id="optb" value="b" />
        <label for="optb">
          <img src="./IMG/p5_optb.gif" class="gifb" />
          <img src="./IMG/p5_textb.png" class="textb" />
          <div class="wave">
            <div class="wave-inner">
              <img src="./IMG/p2.wave.png" />
              <img src="./IMG/p2.wave.png" />
              <img src="./IMG/p2.wave.png" />
              <img src="./IMG/p2.wave.png" />
            </div>
          </div>
        </label>
      </div>
      <div class="optc">
        <input type="radio" name="p2" id="optc" value="c" />
        <label for="optc">
          <img src="./IMG/p5_optc.gif" class="gifc" />
          <img src="./IMG/p5_textc.png" class="textc" />
          <div class="wave">
            <div class="wave-inner">
              <img src="./IMG/p2.wave.png" />
              <img src="./IMG/p2.wave.png" />
              <img src="./IMG/p2.wave.png" />
              <img src="./IMG/p2.wave.png" />
            </div>
          </div>
        </label>
      </div>
      <!-- 繼續航行按鈕 -->
      <a href="./p6.html" class="next">
        <div class="nextbtn">
          <img src="./IMG/nextbtn_boat.png" class="nextboat" />
          <img src="./IMG/nextbtn.png" />
        </div>
      </a>
    </div>
    <!-- 進度條 -->
    <div class="flowcont">
      <div class="flowboat">
        <img src="./IMG/flow_boat.png" class="flowboatimg" />
        <img src="./IMG/p5_flow_text.png" class="flowtext" />
      </div>
      <div class="flow">
        <img src="./IMG/flow.png" class="flowimg" />
      </div>
    </div>
    <!-- 史書紀錄 --><!-- 史書紀錄 --><!-- 史書紀錄 --><!-- 史書紀錄 --><!-- 史書紀錄 --><!-- 史書紀錄 -->
    <div class="book">
      <img src="./IMG/book.png" alt="Book" />
    </div>
    <div class="modal-overlay">
      <div class="modal-content">
        <img src="./IMG/p5_book.png" alt="Book Large" />
      </div>
    </div>
    <script src="./JS/p5.js"></script>
  </body>
</html>
